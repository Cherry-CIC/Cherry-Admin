name: Deploy Cherry Admin (prod)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_ID: cherry-prod-d513e
  REGION: europe-west2
  SERVICE: cherry-admin
  AR_REPOSITORY: cherry-admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.ADMIN_PROD_API_BASE_URL }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.ADMIN_PROD_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.ADMIN_PROD_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ env.PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.ADMIN_PROD_FIREBASE_APP_ID }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - run: gcloud run deploy "${{ env.SERVICE }}" --image "$IMAGE" --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --platform managed --allow-unauthenticated
